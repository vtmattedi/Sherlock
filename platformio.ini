; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Sherlock: ESP32-S3 on the mw-overnight v1.0 board.
[env:mw-overnight]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = partitions_moriarty.csv
monitor_filters = esp32_exception_decoder, send_on_enter
; OTA once the board is running NightMare firmware; flash over USB the first time.
; upload_port = 10.10.3.14
; creds.h, NightMareConfig.h and NightMareHardware.h are this project's configuration, not the
; library's. The library is compiled with its own include path, so the project include dir has to
; be added explicitly for NightMareNetwork's headers to find them.
build_flags =
	-I "${platformio.include_dir}"
extra_scripts = pre:src/Version/script.py
upload_protocol = espota
lib_deps =
	https://github.com/vtmattedi/NightMareNetwork.git
	; Older OneWire releases do not build for the S3.
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	beegee-tokyo/DHT sensor library for ESPx@^1.19
